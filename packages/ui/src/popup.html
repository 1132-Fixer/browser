<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1132 Fixer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="topbar">
    <span class="badge version-badge" id="appVersion">v1.2.7</span>
    <span class="badge scope-badge">Zoom-only</span>
  </div>

  <header class="header">
    <img class="logo-mark" src="icons/popup-logo.png" alt="" width="64" height="64">
    <span class="logo-title">1132 FIXER</span>
    <div class="logo-sep" aria-hidden="true"></div>
    <span class="logo-desc">A focused browser cleanup for Zoom error 1132.</span>
  </header>

  <main class="main">
    <div class="status-badge neutral" id="statusBadge">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusBadgeText">Checking…</span>
    </div>

    <button id="zoomFixBtn" class="btn-zoom" type="button" hidden>FIX ZOOM</button>

    <p class="result" id="result" role="status" aria-live="polite">Checking this tab&hellip;</p>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <a class="badge site-link" href="report.html" target="_blank" rel="noopener noreferrer">Feedback &amp; Report</a>
      <a class="badge site-link" href="https://1132-fixer.xyz/" target="_blank" rel="noopener noreferrer">Visit Website</a>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
